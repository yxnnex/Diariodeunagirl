### ¿Qué se sumó en esta versión?
1. **Controles inferiores con flechas:** Botones `◀ Anterior` y `Siguiente ▶` debajo del libro con el número de página actual.
2. **Animación 3D al pasar de página:** Al cambiar de pliego, el cuaderno realiza una animación de doblez de hoja de 180° con perspectiva.
3. **Múltiples pliegos/páginas:** Cada par de hojas (Páginas 1-2, 3-4, 5-6, etc.) guarda de manera independiente sus stickers, textos, notas e incluso el patrón de fondo de cada página.

      font-family: 'Caveat', cursive;
    }

    }

      background: #1a0f0a;
      border: 8px solid #422517;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.9);
      border-radius: 20px;
      transform-style: preserve-3d;
    }

    .book-page {
      position: relative;
      min-height: 560px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.3);
      overflow: hidden;
      transition: background 0.3s ease;
    }

    /* Animación de giro de página en 3D */
    .turning-next {
      animation: flipNext 0.6s ease-in-out forwards;
    }
    .turning-prev {
      animation: flipPrev 0.6s ease-in-out forwards;
    }

    @keyframes flipNext {
      0% { transform: rotateY(0deg); opacity: 1; }

      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }

    @keyframes flipPrev {

    }

    .bg-kraft {

    .draggable-item:active {
